[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "when-the-judge-is-wrong"
version = "0.1.0"
description = "Reproducible experiments on optimization against imperfect code evaluators"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]
parquet = ["pandas>=2.1,<4", "pyarrow>=15,<24"]
yaml = ["PyYAML>=6,<7"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
all = ["when-the-judge-is-wrong[analysis,parquet,yaml,dev]"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
